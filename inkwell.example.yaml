# Every setting below is documented in docs/guides/configuration.md —
# accepted values, defaults, and what each one changes on the panel.
display: waveshare_7in5_v2
backend: preview
color_mode: gray4  # 4-level grayscale (recommended). Set to "bw" for
#                  # 1-bit black/white. Both paths use the same threshold
#                  # rendering; gray4 keeps soft accents like precip-bar
#                  # interiors visible as dark gray, BW collapses them to
#                  # solid black. Gray4 trade-offs: slower refresh, no
#                  # partial refresh, larger framebuffer.
# clear_on_shutdown: true  # default; clears the panel to white on
#                          # graceful shutdown (SIGINT/SIGTERM) before
#                          # sleeping the controller. Set to false to
#                          # keep the last frame visible — useful for
#                          # post-mortem debugging of a render bug.
#
# How often the panel does its periodic full/ghosting-clearing flash is fixed
# internally (it's a hardware property, not user config). What you DO control is
# each widget's `refresh:` below — how often that widget may refresh the panel.
# IANA zone every widget renders in — clock and date text, the calendar's
# day columns and event times, and the hour the weather chart highlights.
# Defaults to the host's system zone. Set it explicitly on a device: a Pi
# imaged without a timezone reports UTC, and since calendar feeds serialize
# most events as UTC instants, those events would render hours off (and a
# whole day out near midnight) while the clock widget quietly shows UTC too.
timezone: "America/Toronto"

preview:
  port: 8080

# Dashboard-wide weather defaults, shared by every weather widget through one
# cached provider (so widgets at the same location fetch once). Any widget may
# override individual fields in its own config.
weather:
  latitude: 40.7128
  longitude: -74.0060
  model: gem        # forecast model: gfs | ecmwf | gem (see docs/guides/configuration.md)
  temp_unit: C      # C or F

dashboard:
  # Every widget MUST set `refresh:` — a duration of at least 1m (e.g. "5m",
  # "24h") saying how often it may refresh the panel, or "static" for a widget
  # that never changes (e.g. a separator) and so never triggers a refresh.
  # There is no default and no global setting: the value is explicit per widget
  # so it's clear what each one does, and loading fails if any widget omits it.
  # Cadences are wall-clock aligned, so widgets sharing a cadence coalesce onto
  # the same mark (two "5m" widgets both refresh on :00/:05/:10) instead of each
  # flashing independently. NOTE: a widget's `refresh:` (screen-refresh cadence)
  # is distinct from a calendar widget's `config.refresh` (data cache TTL) below.
  #
  # The screens below take turns on the panel, each shown for rotate_interval
  # before the next. A rotation reaches the panel as soon as it happens. Delete
  # the screens you don't want, or remove rotate_interval to stay on the first.
  rotate_interval: "15m"
  screens:
    # The first screen: the day-timeline. Where the screens below are lists,
    # this one is today hour by hour, composed from four widgets rather
    # than drawn as one: the fuzzy clock across the top, today's agenda
    # down the left, and the weather for today and the days ahead down
    # the right. Each widget keeps its own bounds and its own refresh
    # cadence, so the clock can move every five minutes without the
    # calendar asking for more, and a widget whose data doesn't arrive
    # draws what it can without blanking the others.
    #
    # It is the first screen, so with no rotate_interval it is the one
    # shown.
    #
    #   +----------------------------------------------------+  0
    #   |               fuzzy_clock, scale 2                 |
    #   +================================+===================+  46
    #   |                                #   today-weather   |
    #   |          day-timeline          #-------------------+  168
    #   |  hours | weather lane | events #   weather-ahead   |
    #   |                                #  (next four days) |
    #   +--------------------------------+-------------------+  480
    #   0                               532                 800
    - name: day-timeline
      widgets:
        # The header band: the fuzzy clock at twice the body size, the
        # largest scale whose longest phrase fits 800 px.
        # For exact time, a `clock` widget (format: "15:04") fits the same
        # band, at the cost of a refresh every minute.
        - type: fuzzy_clock
          bounds: [0, 0, 800, 46]
          refresh: "5m"    # fuzzy time only changes every ~5 minutes
          config:
            scale: 2
        - type: separator
          bounds: [0, 46, 800, 48]
          refresh: "static"
        # Today on an hourly grid: each event at its real start and end,
        # finished events as outlines and those still to come as solid
        # blocks. The solid blocks move with the schedule, so they don't
        # burn in the way a fixed fill would.
        #
        # The grid shows a window of whole hours, 07:00 to 22:00 unless
        # you set start_hour and end_hour. An event crossing an edge of
        # the window is cut off there with an arrowhead pointing the way
        # it carries on, and events wholly outside it are counted in a
        # "+N EARLIER" or "+N LATER" note. Two overlapping events sit side
        # by side, and a third at the same time is counted in a "+N" tag.
        # All-day events are listed in a strip above the grid. Beside the
        # hour labels, the weather lane shows today's chance of rain as
        # bars and the temperature as a line, hour by hour, and a now
        # marker crosses the lane and the grid at the current time.
        - type: day-timeline
          bounds: [0, 48, 532, 480]
          refresh: "15m"   # how often it may refresh the panel
          config:
            # The shared calendar keys, plus the window. max_events is
            # rejected: every event in the window is placed at its time,
            # and the rest are counted.
            feeds:
              - "https://example.com/my-calendar.ics"
            start_hour: 7        # first hour shown, 0-18
            end_hour: 22         # where the grid ends, 6-24; at least
                                 # six hours after start_hour
            show_location: false
            refresh: "15m"       # calendar cache TTL, NOT the panel
                                 # refresh cadence above
            # Location, model and temp_unit are inherited from the
            # top-level weather: block; override per widget if needed.
        # The rule between the agenda and the weather column, as heavy as
        # the one under the clock.
        - type: separator
          bounds: [532, 48, 534, 480]
          refresh: "static"
          config:
            orientation: vertical
        # Today's forecast as one block: the condition icon, the high at
        # 3x, the low beside it and the condition name. It reads no
        # calendar, so it takes only the weather keys every weather widget
        # takes, all optional; feeds and the other calendar keys are
        # rejected. It needs at least 254 x 108 px. With no forecast for
        # today it says NO FORECAST rather than drawing a made-up number.
        - type: today-weather
          bounds: [534, 48, 800, 168]
          refresh: "1h"    # the forecast is cached for hours; hourly
                           # also turns the day over at midnight
          config:
            # Location, model and temp_unit are inherited from the
            # top-level weather: block; override per widget if needed.
            #   temp_unit: F
            #   weather_model: ecmwf
        # weather-ahead draws no rule above its first row, so a one-pixel
        # separator divides it from today-weather, matching the rules
        # between its own rows.
        - type: separator
          bounds: [534, 168, 800, 169]
          refresh: "static"
          config:
            thickness: 1
        # The days after today as rows of weather only: the weekday and
        # date, the condition icon and name, the high and low, and a
        # combined chart, every chart on one temperature range taken
        # across its own rows. Like today-weather it takes only the
        # weather keys, plus days: how many rows, 1 to 7, default 4. The
        # rows split its height evenly and each needs at least 222 x 62
        # px; a day the forecast doesn't reach says NO FORECAST.
        - type: weather-ahead
          bounds: [534, 169, 800, 480]
          refresh: "1h"    # the forecast is cached for hours; hourly
                           # also turns the day over at midnight
          config:
            days: 4

    # A second screen: bold-five. Five days as columns, today first, with
    # every element sized to be read from across the room rather than
    # from arm's length — the day numeral has a 6.2 mm cap, readable to
    # about 1 m.
    #
    # Every column carries the combined chart — precipitation bars with
    # the temperature line over them — on one temperature scale shared by
    # the five days, so a dry day still shows its line and a cold day
    # sits visibly lower than a warm one. The columns carry their own
    # dates, so there is no separate `date` widget; the screen's clock is
    # a large fuzzy_clock in a header band above them. Event titles get
    # ~14 characters a line, the ceiling for a 160 px column; if titles
    # are the problem, row-agenda is the screen that fixes them.
    - name: bold-five
      widgets:
        # The header band: the fuzzy clock at twice the body size. 2 is
        # the largest scale whose longest phrase fits 800 px; the size
        # is set here rather than guessed from the bounds, so it does
        # not change as the phrase changes length.
        - type: fuzzy_clock
          bounds: [0, 0, 800, 46]
          refresh: "5m"    # fuzzy time only changes every ~5 minutes
          config:
            scale: 2
        - type: separator
          bounds: [0, 46, 800, 48]
          refresh: "static"
        - type: bold-five
          bounds: [0, 48, 800, 480]
          refresh: "15m"   # how often it may refresh the panel
          config:
            # The shared calendar keys. Calendar keys this screen has no
            # use for — days, week_start, show_weather,
            # show_weather_label, highlight_hour — are rejected with an
            # explanation rather than silently ignored.
            feeds:
              - "https://example.com/my-calendar.ics"
            max_events: 3        # three a column under the clock band;
                                 # a day with more says "+N MORE"
            show_location: false
            refresh: "15m"       # calendar cache TTL, NOT the panel
                                 # refresh cadence above
            # Location, model and temp_unit are inherited from the
            # top-level weather: block; override per widget if needed.
            #   temp_unit: F
            #   weather_model: ecmwf

    # A third screen: today-hero. Today at reading distance down the
    # left of the panel, the rest of the week as one-line rows down the
    # right. The bet is that from across the room you only ever want
    # today, and the week is a glance you take once you have walked up
    # to it — so the panel is spent unevenly rather than evenly.
    #
    # Every chart is a combined chart (precipitation bars with the
    # temperature line over them) on one temperature range shared by
    # all five days. Today's is the widest of any screen, with a marker
    # at the current hour; each day row has a small one under its date.
    # Today's agenda shows only what is left of the day — "DONE FOR
    # TODAY" once nothing is. There is no filled block marking today:
    # the date is plain text above a rule, so nothing burns in.
    #
    # What it gives up: the day rows' charts are small (164 px), because
    # a row cannot carry a legible chart and a legible title side by
    # side. They show the shape of the day, not hour-by-hour detail; if
    # that matters for the whole week, bold-five is the screen for it.
    - name: today-hero
      widgets:
        - type: today-hero
          bounds: [0, 0, 800, 480]
          refresh: "15m"   # how often it may refresh the panel
          config:
            # The shared calendar keys, same as bold-five, and the same
            # five keys rejected, each with the reason.
            feeds:
              - "https://example.com/my-calendar.ics"
            max_events: 3        # today's agenda; the scaled time and
                                 # wrapped title make each one tall
            show_location: false
            refresh: "15m"       # calendar cache TTL, NOT the panel
                                 # refresh cadence above
            # Location, model and temp_unit are inherited from the
            # top-level weather: block; override per widget if needed.

    # A fourth screen: row-agenda. The axis swap — days become
    # full-width rows with one event column each, so titles get 35-odd
    # characters instead of bold-five's 14, which makes this the only
    # screen where nothing truncates on a realistic week. "Platform
    # architecture review" fits, and so does "Car in for service".
    #
    # Rows are sized to their events: a quiet day's row is short and a
    # busy day's row is tall, never shorter than the height that keeps
    # its combined chart readable. There are always five rows. When the
    # week will not fit, the busiest rows give up events first, one line
    # at a time, and their last line becomes "+N MORE" — quiet days are
    # never squeezed to make room. Every row carries the combined chart
    # (precipitation bars with the temperature line) on one temperature
    # scale shared by all five days. Today is the first row, shown by
    # position alone: the date is plain on every row, so nothing fills
    # the same patch of panel every refresh.
    #
    # What it gives up: a genuinely packed week loses detail from its
    # busiest days, so this screen is better at reading what is there
    # than at showing everything. Its charts are also the narrowest of
    # the screens that carry them (110 px against bold-five's 160) —
    # still a shape, but a cramped one.
    - name: row-agenda
      widgets:
        - type: row-agenda
          bounds: [0, 0, 800, 480]
          refresh: "15m"   # how often it may refresh the panel
          config:
            # The shared calendar keys. max_events is rejected here:
            # rows grow to fit their events and the busiest give up
            # lines first, so a cap could only contradict that.
            # days, week_start, show_weather, show_weather_label and
            # highlight_hour are rejected too, each with the reason, so
            # a config pasted over from another calendar screen fails
            # to load rather than quietly ignoring half of what you
            # wrote.
            feeds:
              - "https://example.com/my-calendar.ics"
            show_location: false
            refresh: "15m"       # calendar cache TTL, NOT the panel
                                 # refresh cadence above
            # Location, model and temp_unit are inherited from the
            # top-level weather: block; override per widget if needed.

    # A screen of your own, composed from the day widgets: today and
    # tomorrow side by side, under the clock band. The screens above draw
    # each day as a day badge (the date and the day's weather in brief),
    # a combined chart and an event list; those three are also widgets
    # you can place on their own, so a screen can be laid out however
    # you like. This one gives each day half the panel.
    #
    # Each widget names its day: 0 is today, 1 tomorrow, up to 6. The
    # charts share one temperature range because each asks for the same
    # span of days (range_days, counted from today) from the same
    # forecast; give every chart on a screen the same range_days and a
    # cold day sits visibly lower than a warm one.
    #
    # Uncomment it to add it to the rotation.
    #
    #   +---------------------------------------------------+  0
    #   |               fuzzy_clock, scale 2                |
    #   +=========================+=========================+  46
    #   |     day-badge, today    |   day-badge, tomorrow   |
    #   |     combined-chart      |     combined-chart      |  204
    #   |-------------------------|-------------------------|  260
    #   |       event-list        |       event-list        |
    #   +-------------------------+-------------------------+  480
    #   0                        400                       800
    #
    # - name: today-and-tomorrow
    #   widgets:
    #     - type: fuzzy_clock
    #       bounds: [0, 0, 800, 46]
    #       refresh: "5m"
    #       config:
    #         scale: 2
    #     - type: separator
    #       bounds: [0, 46, 800, 48]
    #       refresh: "static"
    #     # Today. The day badge's style is one of the shapes the screens
    #     # above draw it in: column (bold-five's), row (row-agenda's),
    #     # compact (today-hero's day rows) or hero (today-hero's today).
    #     # It reads no calendar, so it takes only the weather keys.
    #     - type: day-badge
    #       bounds: [0, 48, 400, 204]
    #       refresh: "1h"
    #       config:
    #         style: column
    #         day: 0
    #     - type: combined-chart
    #       bounds: [8, 204, 392, 260]
    #       refresh: "1h"
    #       config:
    #         day: 0
    #         range_days: 2    # today and tomorrow share one range
    #     - type: separator
    #       bounds: [0, 260, 400, 261]
    #       refresh: "static"
    #       config:
    #         thickness: 1
    #     # The event list's style is the shape the screens above list
    #     # in: stacked (bold-five's), large (today-hero's agenda) or
    #     # inline (row-agenda's). It reads no forecast, so it takes only
    #     # the calendar keys.
    #     - type: event-list
    #       bounds: [8, 270, 392, 480]
    #       refresh: "15m"
    #       config:
    #         feeds:
    #           - "https://example.com/my-calendar.ics"
    #         style: stacked
    #         day: 0
    #     - type: separator
    #       bounds: [400, 48, 401, 480]
    #       refresh: "static"
    #       config:
    #         thickness: 1
    #         orientation: vertical
    #     # Tomorrow: the same three widgets, day 1.
    #     - type: day-badge
    #       bounds: [401, 48, 800, 204]
    #       refresh: "1h"
    #       config:
    #         style: column
    #         day: 1
    #     - type: combined-chart
    #       bounds: [409, 204, 792, 260]
    #       refresh: "1h"
    #       config:
    #         day: 1
    #         range_days: 2
    #     - type: separator
    #       bounds: [401, 260, 800, 261]
    #       refresh: "static"
    #       config:
    #         thickness: 1
    #     - type: event-list
    #       bounds: [409, 270, 792, 480]
    #       refresh: "15m"
    #       config:
    #         feeds:
    #           - "https://example.com/my-calendar.ics"
    #         style: stacked
    #         day: 1
